name: Lampa Tizen widget

# Builds widget/ into a signed Lampa.wgt and publishes it as the latest release,
# so TizenBrew Installer can install it by typing docdmone/lampa-tizen.

on:
  workflow_dispatch:
  push:
    paths:
      - 'widget/**'
      - '.github/workflows/lampa-widget.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get tizen.js (signs Tizen packages without Tizen Studio)
        run: |
          git clone --depth 1 https://github.com/reisxd/tizen.js "$RUNNER_TEMP/tizenjs"
          cd "$RUNNER_TEMP/tizenjs" && npm install --omit=dev --no-audit --no-fund
          # tizen.js makes the author certificate valid for a year, past the end of the
          # Tizen Developers CA (2027-01-01), so the TV rejects the chain ("Invalid signature").
          # End it with the CA, as Tizen Studio does.
          sed -i "s|cert.validity.notAfter = new Date(Date.now() + 365 \* 24 \* 60 \* 60 \* 1000);|cert.validity.notAfter = new Date('2027-01-01T00:00:00Z');|" src/tizenCertificateCreator.js
          grep -q "2027-01-01T00:00:00Z" src/tizenCertificateCreator.js

      - name: Make a Tizen author certificate
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          echo "CERT_PW=$PW" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/tizenjs/cli.js" create-tizen-cert \
            --name "Lampa for Tizen" --password "$PW" --output "$RUNNER_TEMP/author.p12"

      - name: Build and sign Lampa.wgt
        working-directory: widget
        run: |
          node "$RUNNER_TEMP/tizenjs/cli.js" build . -t wgt -o "$GITHUB_WORKSPACE/Lampa.wgt" \
            --author "$RUNNER_TEMP/author.p12" --authorPwd "$CERT_PW" -p public

      # The TV's installer failed with "Unzip error" (118, -23) on the JSZip output.
      # Repack it the way known-good Tizen packages look: files only, no folder entries,
      # author-signature.xml first, DOS-style headers with no Unix permission bits.
      # The signatures cover file contents only, so they stay valid.
      - name: Repack like a standard Tizen package
        run: |
          python3 - <<'PY'
          import zipfile
          src = zipfile.ZipFile('Lampa.wgt')
          files = {i.filename: src.read(i) for i in src.infolist() if not i.filename.endswith('/')}
          src.close()
          head = ['author-signature.xml', 'signature1.xml', 'config.xml']
          order = head + sorted(n for n in files if n not in head)
          with zipfile.ZipFile('Lampa.wgt', 'w') as out:
              for name in order:
                  info = zipfile.ZipInfo(name, date_time=(2026, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 0
                  info.external_attr = 0
                  out.writestr(info, files[name])
          PY
          unzip -l Lampa.wgt | head -8
          ! unzip -l Lampa.wgt | awk '{print $4}' | grep -q '/$'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "widget-${{ github.run_number }}" Lampa.wgt \
            --title "Lampa widget ${{ github.run_number }}" \
            --notes "Lampa for Samsung Tizen (2017-2022 TVs). Install with TizenBrew Installer: docdmone/lampa-tizen" \
            --latest
